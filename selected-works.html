<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selected Works — Bella Bacon</title>
  <meta name="description" content="Selected paintings by London artist Bella Bacon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a class="site-title" href="index.html">Bella Bacon</a>
    <nav>
      <ul>
        <li><a href="index.html">About</a></li>
        <li><a href="selected-works.html" aria-current="page">Selected Works</a></li>
        <li><a href="https://www.instagram.com/bellaabacon/" target="_blank" rel="noopener">Instagram</a></li>
        <li><a href="mailto:bellapbacon@gmail.com">Email</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- To add titles under a painting, put e.g. <p>Title, 2026, oil on canvas</p> after the <button>. -->
    <section class="works">
      <button><img src="siteimage1.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
      <button><img src="siteimage2.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
      <button><img src="siteimage3.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
      <button><img src="siteimage4.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
      <button><img src="siteimage5.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
      <button><img src="siteimage6.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
      <button><img src="siteimage7.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
      <button><img src="siteimage8.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
      <button><img src="siteimage9.jpg" alt="Painting by Bella Bacon" loading="lazy"></button>
    </section>
  </main>

  <!-- Click any painting to view it large; click again or press Esc to close -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="Enlarged painting">
    <img src="" alt="">
  </div>

  <footer>
    <span>© Bella Bacon</span>
    <a href="https://www.instagram.com/bellaabacon/" target="_blank" rel="noopener">@bellaabacon</a>
    <a href="mailto:bellapbacon@gmail.com">bellapbacon@gmail.com</a>
  </footer>

  <script>
    const box = document.getElementById('lightbox');
    const big = box.querySelector('img');
    document.querySelectorAll('.works button').forEach(btn => {
      btn.addEventListener('click', () => {
        const img = btn.querySelector('img');
        big.src = img.src;
        big.alt = img.alt;
        box.classList.add('open');
      });
    });
    const close = () => box.classList.remove('open');
    box.addEventListener('click', close);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  </script>
</body>
</html>
